name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      # shellcheck ships with the ubuntu runner image.
      - run: shellcheck bin/task-tab bin/task-color bin/lib/common.sh install.sh
